<!DOCTYPE html>
<!-- mtd-duration-panel : duration_stats 자동주입 방지 마커 (WATSON은 지속기간 패널 미사용) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WATSON · 종목 리서치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#08080a;--panel:#0f0f11;--panel2:#161618;--border:#1d1d20;--border2:#2a2a2e;
    --ink:#e6e6ea;--muted:#8a8a93;--faint:#55555d;
    --go:#2bd07a;--caution:#F2B233;--stop:#ff3b46;
    /* WATSON 정체성: 블루 계열 (마틸다=레드와 구분) */
    --accent:#3B82F6;--accent2:#60A5FA;--accent-soft:rgba(59,130,246,.13);
    --steel:#3B82F6;
    --mono:'JetBrains Mono',monospace;--disp:'Space Grotesk',sans-serif;
    --body:'Pretendard',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:16px 20px 70px}
  #splash{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;opacity:1;transition:opacity .6s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .sp-mark{width:80px;height:80px;opacity:0;transform:scale(.5);animation:sppop 1s cubic-bezier(.2,.9,.25,1) forwards}
  #splash .sp-word{font-family:var(--disp);font-weight:600;font-size:34px;color:var(--ink);opacity:0;animation:spword 1.1s ease .25s forwards}
  #splash .sp-line{width:0;height:2px;background:var(--accent);animation:spline 1.2s cubic-bezier(.2,.9,.2,1) .35s forwards}
  @keyframes sppop{to{opacity:1;transform:scale(1)}}
  @keyframes spword{0%{opacity:0;letter-spacing:.5em}100%{opacity:1;letter-spacing:.16em}}
  @keyframes spline{to{width:160px}}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .brand .logo{display:inline-block;width:24px;height:24px}
  .backlink{font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none;border:1px solid var(--border);border-radius:3px;padding:6px 11px;transition:.12s}
  .backlink:hover{color:var(--ink);border-color:var(--border2)}
  .searchwrap{position:relative;flex:1;max-width:360px;display:flex}
  #searchInput{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--border);border-radius:3px;padding:9px 13px;width:100%;outline:none}
  #searchInput:focus{border-color:var(--accent)}
  .searchres{position:absolute;top:42px;left:0;width:100%;max-height:340px;overflow:auto;z-index:50;
    background:var(--panel);border:1px solid var(--border);border-radius:3px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .searchres.show{display:block}
  .searchres .sr{padding:10px 13px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--panel2);display:flex;align-items:center;gap:8px}
  .searchres .sr:hover{background:var(--panel2)}
  .searchres .sr b{font-family:var(--mono);color:var(--ink)}
  .searchres .sr span{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .searchres .sr i{font-style:normal;font-size:10px;color:var(--faint);white-space:nowrap}
  .searchres .sempty{padding:12px 13px;color:var(--faint);font-size:12px;font-family:var(--mono)}
  .mkt-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;
    border:1px solid;letter-spacing:.03em}
  .mkt-US{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .mkt-KR{color:var(--caution);border-color:var(--caution);background:rgba(242,178,51,.12)}
  .hero{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:22px 24px;margin-bottom:16px}
  .hero-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .hero-name{font-family:var(--disp);font-weight:700;font-size:22px}
  .hero-code{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .hero-period{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
  .hi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  @media(max-width:640px){.hi-grid{grid-template-columns:1fr}}
  .hi{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:14px 16px}
  .hi-lab{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .hi-val{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--ink)}
  .hi-yoy{font-family:var(--mono);font-size:12px;margin-top:5px}
  .hi-yoy.up{color:var(--go)} .hi-yoy.down{color:var(--stop)} .hi-yoy.flat{color:var(--faint)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:18px 20px;margin-bottom:16px}
  .panel h3{font-family:var(--disp);font-size:14px;margin-bottom:3px;display:flex;align-items:center;gap:8px}
  .panel .psub{font-size:11px;color:var(--faint);font-weight:400}
  .fintab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:12px}
  .fintab th,.fintab td{padding:9px 10px;border-bottom:1px solid var(--panel2);text-align:right}
  .fintab th:first-child,.fintab td:first-child{text-align:left;color:var(--muted)}
  .fintab thead th{color:var(--faint);font-size:10.5px;font-weight:700;border-bottom:1px solid var(--border2)}
  .fintab .grp{color:var(--accent);font-weight:700;font-size:11px;padding-top:14px;text-align:left}
  .fintab .na{color:var(--faint)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
  .metric{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:13px 15px}
  .metric-v{font-family:var(--mono);font-weight:700;font-size:20px}
  .metric-l{font-size:11.5px;color:var(--muted);margin-top:4px}
  .metric-f{font-size:10px;color:var(--faint);margin-top:6px;font-family:var(--mono)}
  .metric-note{font-size:10px;color:var(--caution);margin-top:5px}
  .empty{color:var(--faint);font-family:var(--mono);font-size:13px;text-align:center;padding:60px 20px;line-height:1.7}
  .empty .big{font-size:15px;color:var(--muted);margin-bottom:8px}
  .loading{color:var(--faint);font-family:var(--mono);font-size:12.5px;text-align:center;padding:40px}
  .note{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--panel2)}
  .keybox{background:var(--panel2);border:1px solid var(--caution);border-radius:3px;padding:14px 16px;margin-top:10px;font-size:12px;line-height:1.7;color:var(--muted)}
  .keybox b{color:var(--ink)}
  .keybox code{font-family:var(--mono);background:var(--bg);padding:2px 6px;border-radius:2px;color:var(--accent2)}
  .err{color:var(--stop);font-family:var(--mono);font-size:12.5px;padding:20px;text-align:center}
  footer{margin-top:24px;color:var(--faint);font-size:11px;text-align:center;line-height:1.6}
  footer a{color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <div id="splash"><div class="sp-mark" id="spMark"></div><div class="sp-word">WATSON</div><div class="sp-line"></div></div>
  <div class="bar">
    <div class="brand"><span class="logo" id="brandLogo"></span>WATSON</div>
    <div class="searchwrap">
      <input id="searchInput" placeholder="종목 검색 (예: AAPL, NVDA, 삼성전자, 005930)" autocomplete="off" spellcheck="false">
      <div class="searchres" id="searchResults"></div>
    </div>
    <a class="backlink" href="/">← MATILDA</a>
  </div>

  <div id="content">
    <div class="empty">
      <div class="big">종목을 검색하세요</div>
      미국 종목(AAPL·NVDA…)은 Financial Modeling Prep, 한국 종목(삼성전자·005930…)은 DART 공시 기반<br>
      재무제표 · 펀더멘탈 · 실적 요약을 조회합니다
    </div>
  </div>

  <footer>
    미국: Financial Modeling Prep · 한국: 금융감독원 DART (opendart.fss.or.kr) 공시 기반<br>
    공시 원본 재무 데이터입니다. 투자 자문이 아니며, 판단과 결과의 책임은 사용자에게 있습니다. · <a href="/">MATILDA로 돌아가기</a>
  </footer>
</div>
<script>
const C={ink:'#e6e6ea',accent:'#3B82F6',accent2:'#60A5FA',go:'#2bd07a',stop:'#ff3b46',
  caution:'#F2B233',muted:'#8a8a93',faint:'#55555d'};

/* ---------- WATSON 로고: 일본 가몬 풍 눈 목(目) 문장 ---------- */
function watsonSVG(m, col){
  m=Math.max(0,Math.min(1,m));
  const c=col||'#3B82F6';
  const op=(0.45+0.55*m).toFixed(2);
  return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' style='width:100%;height:100%'>"
    +"<g opacity='"+op+"'>"
    +"<circle cx='32' cy='32' r='29' fill='none' stroke='"+c+"' stroke-width='3.6'/>"
    +"<rect x='20' y='12' width='24' height='40' fill='none' stroke='"+c+"' stroke-width='3.4'/>"
    +"<line x1='20' y1='25.3' x2='44' y2='25.3' stroke='"+c+"' stroke-width='3.2'/>"
    +"<line x1='20' y1='38.6' x2='44' y2='38.6' stroke='"+c+"' stroke-width='3.2'/>"
    +"</g></svg>";
}
function setFavicon(){
  let l=document.querySelector("link[rel='icon']");
  if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l);}
  l.type='image/svg+xml';
  l.href='data:image/svg+xml,'+encodeURIComponent(watsonSVG(1));
}
setFavicon();
document.getElementById('brandLogo').innerHTML=watsonSVG(1);
document.getElementById('spMark').innerHTML=watsonSVG(1);
(function(){var sp=document.getElementById('splash');
  if(sp){setTimeout(function(){sp.classList.add('hide');
    setTimeout(function(){sp.style.display='none';},650);},1200);}})();

/* ---------- 응답 파서(비 JSON 방어) — 마틸다 safeJson 계승 ---------- */
async function safeJson(res){
  const ct=res.headers.get('content-type')||'';
  const txt=await res.text();
  if(ct.indexOf('application/json')<0){
    if(!res.ok) throw new Error('서버 응답 오류 (HTTP '+res.status+') — 배포 중이거나 일시 장애일 수 있어요.');
    throw new Error('서버가 예상치 못한 응답을 보냈습니다.');
  }
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error('응답 파싱 실패'); }
}

/* ---------- 숫자 포맷 ---------- */
function fmtMoney(v, market){
  if(v==null) return '—';
  const neg=v<0; v=Math.abs(v);
  let s;
  if(market==='KR'){ // 원 → 조/억
    if(v>=1e12) s=(v/1e12).toFixed(2)+'조';
    else if(v>=1e8) s=(v/1e8).toFixed(0)+'억';
    else s=Math.round(v).toLocaleString();
    s=s+'원';
  }else{ // USD → B/M
    if(v>=1e9) s='$'+(v/1e9).toFixed(2)+'B';
    else if(v>=1e6) s='$'+(v/1e6).toFixed(1)+'M';
    else s='$'+Math.round(v).toLocaleString();
  }
  return (neg?'−':'')+s;
}
function fmtPct(v){ return v==null?'—':(v>=0?'+':'')+v+'%'; }
function yoyClass(v){ return v==null?'flat':v>0.05?'up':v<-0.05?'down':'flat'; }

/* ---------- 종목 검색 (마틸다 방식 + 한글/코드 지원) ---------- */
let searchTimer=null;
const sInput=document.getElementById('searchInput'), sRes=document.getElementById('searchResults');
sInput.addEventListener('input',()=>{
  const q=sInput.value.trim(); clearTimeout(searchTimer);
  if(q.length<1){sRes.innerHTML='';sRes.classList.remove('show');return;}
  searchTimer=setTimeout(async()=>{
    try{
      let rs=[];
      try{ // 한국주식(005930·삼성전자) + 미국 티커 모두 /api/search 가 처리
        const d1=await safeJson(await fetch('/api/search?q='+encodeURIComponent(q)));
        if(Array.isArray(d1)&&d1.length)rs=d1.map(r=>({symbol:r.symbol,name:r.name||'',exchange:r.exchange||''}));
      }catch(e){}
      if(!rs.length){ // 폴백: 마틸다 검색(미국 위주)
        try{const d=await safeJson(await fetch('/search?q='+encodeURIComponent(q)));
          rs=((d&&d.results)||[]).map(r=>({symbol:r.symbol,name:r.name||'',exchange:r.exchange||''}));}catch(e){}
      }
      if(!rs.length){sRes.innerHTML="<div class='sempty'>결과 없음</div>";}
      else sRes.innerHTML=rs.map(r=>"<div class='sr' data-sym='"+r.symbol+"'><b>"+r.symbol+"</b> <span>"+r.name+"</span> <i>"+r.exchange+"</i></div>").join('');
      sRes.classList.add('show');
      sRes.querySelectorAll('.sr').forEach(el=>el.onclick=()=>{
        const sym=el.dataset.sym;
        sInput.value='';sRes.innerHTML='';sRes.classList.remove('show');
        loadTicker(sym);});
    }catch(e){sRes.innerHTML="<div class='sempty'>검색 오류</div>";sRes.classList.add('show');}
  },350);
});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap')){sRes.classList.remove('show');}});
// 엔터로 바로 조회(검색결과 없이 티커 직접 입력 시)
sInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const q=sInput.value.trim(); if(q){sInput.value='';sRes.classList.remove('show');loadTicker(q);}}
});

/* ---------- 종목 조회: 3개 API 병렬 ---------- */
async function loadTicker(code){
  const box=document.getElementById('content');
  box.innerHTML="<div class='loading'>WATSON이 "+code.toUpperCase()+" 공시를 조회하는 중…</div>";
  try{
    const [sum,fin,fund]=await Promise.all([
      safeJson(await fetch('/api/butler/summary/'+encodeURIComponent(code))),
      safeJson(await fetch('/api/butler/financials/'+encodeURIComponent(code))),
      safeJson(await fetch('/api/butler/fundamentals/'+encodeURIComponent(code))),
    ]);
    // 키 미설정: 미국(FMP) / 한국(DART) 구분
    if(sum.need_fmp_key||fin.need_fmp_key||fund.need_fmp_key){ renderNeedKey(code,'FMP'); return; }
    if(sum.need_key||fin.need_key||fund.need_key){ renderNeedKey(code,'DART'); return; }
    // 조회 실패
    if(sum.error && !sum.highlights){ renderError(code, sum); return; }
    render(code, sum, fin, fund);
  }catch(e){
    box.innerHTML="<div class='err'>조회 실패: "+e.message+"</div>";
  }
}

function renderNeedKey(code, which){
  if(which==='FMP'){
    document.getElementById('content').innerHTML=
      "<div class='panel'><h3>FMP 키가 필요합니다</h3>"
      +"<div class='keybox'>미국 종목("+code.toUpperCase()+")의 재무 데이터는 <b>Financial Modeling Prep</b>에서 받습니다. "
      +"무료 API 키를 발급받아 서버에 등록하면 조회됩니다.<br><br>"
      +"1. <b>site.financialmodelingprep.com</b> 에서 무료 가입 → API Key 복사<br>"
      +"2. Render 환경변수에 <code>FMP_API_KEY</code> 로 등록<br><br>"
      +"무료 플랜은 하루 250회까지 조회할 수 있습니다.</div></div>";
    return;
  }
  document.getElementById('content').innerHTML=
    "<div class='panel'><h3>DART 키가 필요합니다</h3>"
    +"<div class='keybox'>한국 종목("+code+")의 재무 데이터는 금융감독원 <b>DART</b> 공시를 씁니다. "
    +"무료 API 키를 발급받아 서버에 등록하면 조회됩니다.<br><br>"
    +"1. <b>opendart.fss.or.kr</b> 에서 무료 인증키 발급<br>"
    +"2. Render 환경변수에 <code>DART_API_KEY</code> 로 등록</div></div>";
}
function renderError(code, d){
  const msg = d.not_us ? "미국 상장 종목을 찾을 수 없습니다."
    : d.not_kr ? "한국 상장 종목을 찾을 수 없습니다."
    : d.unknown ? "인식할 수 없는 코드입니다."
    : (d.error||"조회할 수 없습니다.");
  document.getElementById('content').innerHTML=
    "<div class='empty'><div class='big'>"+code.toUpperCase()+"</div>"+msg
    +"<br><br>미국은 티커(AAPL), 한국은 종목명(삼성전자) 또는 6자리 코드(005930)로 검색하세요.</div>";
}
/* ---------- 렌더 ---------- */
function render(code, sum, fin, fund){
  const market=sum.market||fin.market||'US';
  const name=sum.corp_name||code.toUpperCase();
  const scode=sum.stock_code||code.toUpperCase();
  const basis=(sum.period&&sum.period.basis)||
    (fin.period&&fin.period.year?fin.period.year+'년 '+({11011:'사업보고서',11014:'3분기',11012:'반기',11013:'1분기'}[fin.period.reprt]||''):'');
  const mktBadge="<span class='mkt-badge mkt-"+market+"'>"+(market==='US'?'미국 · FMP':'한국 · DART')+"</span>";

  let html="";
  // HERO — 요약(실적 하이라이트)
  html+="<div class='hero'><div class='hero-top'>"
    +"<span class='hero-name'>"+name+"</span>"
    +"<span class='hero-code'>"+scode+"</span>"+mktBadge
    +"<span class='hero-period'>"+basis+(fin.period&&fin.period.fs_div?' · '+fin.period.fs_div:'')+"</span></div>";
  html+="<div class='hi-grid'>";
  (sum.highlights||[]).forEach(h=>{
    html+="<div class='hi'><div class='hi-lab'>"+h.label+"</div>"
      +"<div class='hi-val'>"+fmtMoney(h.value,market)+"</div>"
      +"<div class='hi-yoy "+yoyClass(h.yoy)+"'>YoY "+fmtPct(h.yoy)+"</div></div>";
  });
  html+="</div></div>";

  // 재무제표
  html+="<div class='panel'><h3>재무정보 <span class='psub'>"+(fin.unit==='USD'?'단위 USD':'단위 원')+" · 최근 3期</span></h3>";
  if(fin.error && !fin.statements){
    html+="<div class='err'>"+fin.error+"</div>";
  }else{
    const st=fin.statements||{};
    html+="<table class='fintab'><thead><tr><th>계정</th><th>당기</th><th>전기</th><th>전전기</th></tr></thead><tbody>";
    Object.keys(st).forEach(grp=>{
      html+="<tr><td class='grp' colspan='4'>"+grp+"</td></tr>";
      (st[grp]||[]).forEach(row=>{
        html+="<tr><td>"+row.name+"</td>"
          +row.values.map(v=>"<td"+(v==null?" class='na'":"")+">"+(v==null?'—':fmtMoney(v,market))+"</td>").join('')
          +"</tr>";
      });
    });
    html+="</tbody></table>";
  }
  if(fin.note)html+="<div class='note'>"+fin.note+"</div>";
  html+="</div>";

  // 펀더멘탈
  html+="<div class='panel'><h3>펀더멘탈 <span class='psub'>공시 재무 기반 비율 지표</span></h3>";
  if(fund.error && !fund.metrics){
    html+="<div class='err'>"+fund.error+"</div>";
  }else{
    const m=fund.metrics||{};
    html+="<div class='metrics'>";
    Object.keys(m).forEach(k=>{
      const it=m[k];
      const col = it.value==null?C.faint
        : (k==='부채비율' ? (it.value>=200?C.stop:it.value>=100?C.caution:C.go)
          : (it.value>=0?C.go:C.stop));
      html+="<div class='metric'><div class='metric-v' style='color:"+col+"'>"
        +(it.value==null?'—':it.value+(it.unit||''))+"</div>"
        +"<div class='metric-l'>"+k+"</div>"
        +(it.formula?"<div class='metric-f'>"+it.formula+"</div>":"")
        +(it.note?"<div class='metric-note'>"+it.note+"</div>":"")
        +"</div>";
    });
    html+="</div>";
    // 주주환원 (자사주 + 배당)
    const sr=fund.shareholder_return;
    if(sr && (sr.자사주매입!=null || sr.배당지급!=null)){
      const pr=sr.총환원율||{};
      const prCol = pr.value==null?C.faint : pr.value>=100?C.caution : C.go;
      html+="<div style='margin-top:18px;padding-top:14px;border-top:1px solid var(--border2)'>"
        +"<div style='font-family:var(--disp);font-size:12.5px;font-weight:600;margin-bottom:10px'>주주환원 <span style='font-size:10.5px;color:var(--faint);font-weight:400'>번 돈을 주주에게 얼마나 돌려주나</span></div>"
        +"<div class='metrics'>";
      html+="<div class='metric'><div class='metric-v' style='color:"+C.accent2+"'>"+fmtMoney(sr.자사주매입,market)+"</div><div class='metric-l'>자사주 매입</div></div>";
      html+="<div class='metric'><div class='metric-v' style='color:"+C.accent2+"'>"+fmtMoney(sr.배당지급,market)+"</div><div class='metric-l'>배당 지급</div></div>";
      html+="<div class='metric'><div class='metric-v' style='color:"+prCol+"'>"+(pr.value==null?'—':pr.value+'%')+"</div><div class='metric-l'>총환원율</div>"
        +(pr.formula?"<div class='metric-f'>"+pr.formula+"</div>":"")
        +(pr.note?"<div class='metric-note'>"+pr.note+"</div>":"")+"</div>";
      html+="</div></div>";
    }
    // 원천 수치
    if(fund.raw){
      html+="<table class='fintab' style='margin-top:16px'><thead><tr><th>원천 계정</th><th>금액</th></tr></thead><tbody>";
      Object.keys(fund.raw).forEach(k=>{
        html+="<tr><td>"+k+"</td><td"+(fund.raw[k]==null?" class='na'":"")+">"+fmtMoney(fund.raw[k],market)+"</td></tr>";
      });
      html+="</tbody></table>";
    }
  }
  if(fund.note)html+="<div class='note'>"+fund.note+"</div>";
  html+="</div>";

  document.getElementById('content').innerHTML=html;
}

// URL ?q=AAPL 로 진입 시 자동 조회
(function(){
  const p=new URLSearchParams(location.search).get('q');
  if(p)loadTicker(p);
})();
</script>
