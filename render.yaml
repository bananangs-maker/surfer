# Render Blueprint for the SURFER diagnostic viewer.
#
# This hosts a REPORT VIEWER, not trading automation. It reads market data and
# renders a diagnostic. It places no orders and holds no credentials.
services:
  - type: web
    name: surfer-diagnostic
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --bind is explicit even though gunicorn honours $PORT by default; Render
    # fails the deploy if nothing answers on that port, so it is worth stating.
    # Long timeout: fetching 730 days of 60m bars can take a while.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
